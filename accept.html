<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Quotation — Studio App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f4; color: #1a1a1a; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
      padding: 2rem; max-width: 560px; width: 100%; margin-bottom: 1rem;
    }
    /* Teal header matching PDF */
    .doc-header {
      background: #2d4650; border-radius: 12px 12px 0 0;
      padding: 1.25rem 1.5rem; display: flex;
      justify-content: space-between; align-items: flex-start;
      margin: -2rem -2rem 1.5rem;
    }
    .doc-title  { color: #d4b464; font-size: 20px; font-weight: 800; margin-bottom: .4rem; }
    .doc-ref    { color: #fff; font-size: 13px; font-weight: 600; }
    .doc-date   { color: #d4b464; font-size: 11px; margin-top: .25rem; }
    .doc-logo   { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
    .logo-placeholder { width: 52px; height: 52px; background: rgba(255,255,255,.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #d4b464; }

    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #aaa; margin-bottom: .35rem; }
    .client-name   { font-size: 20px; font-weight: 800; margin-bottom: .25rem; }
    .studio-name   { font-size: 18px; font-weight: 800; }
    .meta-text     { font-size: 12px; color: #666; }

    .bill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }

    /* Line items */
    table { width: 100%; border-collapse: collapse; margin-bottom: .5rem; }
    thead th { background: #f0f0ee; padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #555; }
    thead th:last-child { text-align: right; }
    tbody td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    tbody td:nth-child(2), tbody td:nth-child(3) { color: #666; }
    tbody td:last-child { text-align: right; font-weight: 600; }

    /* Totals */
    .totals { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    .totals-inner { min-width: 200px; }
    .tot-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: #555; }
    .tot-row.discount { color: #1d6f42; }
    .tot-row.grand { font-size: 16px; font-weight: 800; color: #1a1a1a; border-top: 2px solid #1a1a1a; padding-top: 8px; margin-top: 4px; }

    .divider { border: none; border-top: 1px solid #e5e5e5; margin: 1rem 0; }

    /* Valid until */
    .valid-badge {
      display: inline-block; background: #fef9ee; border: 1px solid #fcd34d;
      color: #92400e; border-radius: 8px; padding: 6px 12px; font-size: 12px;
      font-weight: 600; margin-bottom: 1rem;
    }
    .expired-badge {
      display: inline-block; background: #fef2f2; border: 1px solid #fca5a5;
      color: #9b1c1c; border-radius: 8px; padding: 6px 12px; font-size: 12px;
      font-weight: 600; margin-bottom: 1rem;
    }

    /* Accept button */
    .accept-btn {
      width: 100%; padding: 16px; background: #1a1a1a; color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background .15s; margin-top: .5rem;
    }
    .accept-btn:hover { background: #333; }
    .accept-btn:disabled { background: #aaa; cursor: default; }

    /* Accepted state */
    .accepted-box {
      background: #eaf3de; border: 1px solid #97c459; border-radius: 12px;
      padding: 1.5rem; text-align: center; margin-top: .5rem;
    }
    .accepted-icon  { font-size: 2rem; margin-bottom: .5rem; }
    .accepted-title { font-size: 18px; font-weight: 700; color: #1d6f42; margin-bottom: .25rem; }
    .accepted-time  { font-size: 13px; color: #3b6d11; }

    .notes-box { background: #fafaf9; border-radius: 8px; padding: .85rem 1rem; font-size: 12px; color: #666; margin-top: .75rem; }

    .powered { font-size: 11px; color: #aaa; text-align: center; margin-top: 1rem; }
    .powered a { color: #aaa; }

    @media(max-width: 480px) {
      .bill-grid { grid-template-columns: 1fr; }
      .card { padding: 1.25rem; }
      .doc-header { margin: -1.25rem -1.25rem 1.25rem; }
    }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <div class="doc-header">
    <div>
      <div class="doc-title">QUOTATION</div>
      <div class="doc-ref" id="h-ref">Loading...</div>
      <div class="doc-date" id="h-date"></div>
    </div>
    <div id="h-logo">
      <div class="logo-placeholder">LOGO</div>
    </div>
  </div>

  <div id="content">
    <div style="text-align:center;padding:2rem;color:#aaa">Loading quotation...</div>
  </div>
</div>

<div class="powered">
  Powered by <a href="/" target="_blank">Studio App</a>
</div>

<!-- Load Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script>
// ── Helpers ────────────────────────────────────────────────
function fmtINR(n) {
  return '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
}
function formatDate(s) {
  if (!s) return '—';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}
function formatDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) +
    ' at ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

// ── Load quote from localStorage ──────────────────────────
const params  = new URLSearchParams(window.location.search);
const quoteId = params.get('id');
const KEYS    = { quotes: 'sa_quotes_v1', settings: 'sa_settings_v1' };

function getQuote() {
  try {
    const quotes = JSON.parse(localStorage.getItem(KEYS.quotes)) || [];
    return quotes.find(q => q.id === quoteId) || null;
  } catch { return null; }
}
function getSettings() {
  try { return JSON.parse(localStorage.getItem(KEYS.settings)) || {}; } catch { return {}; }
}
function saveQuote(q) {
  try {
    const quotes = JSON.parse(localStorage.getItem(KEYS.quotes)) || [];
    const idx = quotes.findIndex(x => x.id === q.id);
    if (idx >= 0) quotes[idx] = q; else quotes.unshift(q);
    localStorage.setItem(KEYS.quotes, JSON.stringify(quotes));
  } catch {}
}

// ── Render ─────────────────────────────────────────────────
function render() {
  const q = getQuote();
  const s = getSettings();

  if (!q) {
    document.getElementById('content').innerHTML = `
      <div style="text-align:center;padding:2rem">
        <div style="font-size:2rem;margin-bottom:.75rem">🔍</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:.4rem">Quotation not found</div>
        <div style="font-size:13px;color:#888">This link may be invalid or the quotation has been deleted.</div>
      </div>`;
    return;
  }

  // Header
  document.getElementById('h-ref').textContent  = q.ref || '';
  document.getElementById('h-date').textContent = 'Date: ' + formatDate(q.quoteDate);
  if (s.logo) {
    document.getElementById('h-logo').innerHTML =
      `<img class="doc-logo" src="${s.logo}" alt="Logo">`;
  }

  // Check already accepted
  const isAccepted = q.status === 'accepted' && q.acceptedAt;
  const isExpired  = q.validUntil && new Date(q.validUntil + 'T23:59:59') < new Date() && !isAccepted;

  // Line items rows
  const lineRows = (q.lineItems || []).map(item => {
    const amt = Math.round((item.qty||1) * (item.rate||0));
    return `<tr>
      <td>${esc(item.desc||'')}</td>
      <td>${item.qty||1}</td>
      <td>${fmtINR(item.rate||0)}</td>
      <td>${fmtINR(amt)}</td>
    </tr>`;
  }).join('');

  const subtotal   = q.subtotal  || 0;
  const discount   = q.discount  || 0;
  const gst        = q.gst       || 0;
  const gstRate    = q.gstRate   || 0;
  const total      = q.total     || 0;

  const discountRow = discount > 0
    ? `<div class="tot-row discount">
        <span>${q.discountType === 'pct' ? `Discount (${q.discountValue}%)` : 'Discount'}</span>
        <span>-${fmtINR(discount)}</span>
       </div>` : '';
  const gstRow = gst > 0
    ? `<div class="tot-row"><span>GST (${gstRate}%)</span><span>${fmtINR(gst)}</span></div>` : '';

  const validBadge = isExpired
    ? `<div class="expired-badge">⚠ This quotation expired on ${formatDate(q.validUntil)}</div>`
    : q.validUntil
      ? `<div class="valid-badge">Valid until ${formatDate(q.validUntil)}</div>`
      : '';

  const acceptSection = isAccepted
    ? `<div class="accepted-box">
        <div class="accepted-icon">✅</div>
        <div class="accepted-title">Quotation accepted</div>
        <div class="accepted-time">Accepted on ${formatDateTime(q.acceptedAt)}</div>
       </div>`
    : `<button class="accept-btn" id="accept-btn" onclick="acceptQuote()" ${isExpired ? 'disabled' : ''}>
        ${isExpired ? 'This quotation has expired' : 'I accept this quotation'}
       </button>
       <div style="font-size:11px;color:#aaa;text-align:center;margin-top:.6rem">
         By clicking accept, you confirm agreement to the quotation terms above.
       </div>`;

  document.getElementById('content').innerHTML = `
    <div class="bill-grid">
      <div>
        <div class="section-label">Quotation to</div>
        <div class="client-name">${esc(q.clientName||'—')}</div>
        ${q.clientContact ? `<div class="meta-text">${esc(q.clientContact)}</div>` : ''}
        ${q.eventDate ? `<div class="meta-text" style="margin-top:4px">Event: ${formatDate(q.eventDate)}${q.venue?' · '+esc(q.venue):''}</div>` : ''}
      </div>
      <div>
        <div class="section-label">Quotation from</div>
        <div class="studio-name">${esc(s.studioName||'Studio App')}</div>
        ${s.phone ? `<div class="meta-text">${esc(s.phone)}</div>` : ''}
        ${s.email ? `<div class="meta-text">${esc(s.email)}</div>` : ''}
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th>
        </tr>
      </thead>
      <tbody>${lineRows}</tbody>
    </table>

    <div class="totals">
      <div class="totals-inner">
        <div class="tot-row"><span>Subtotal</span><span>${fmtINR(subtotal)}</span></div>
        ${discountRow}
        ${gstRow}
        <div class="tot-row grand"><span>Total</span><span>${fmtINR(total)}</span></div>
      </div>
    </div>

    ${q.notes ? `<div class="notes-box">${esc(q.notes)}</div>` : ''}

    <hr class="divider">
    ${validBadge}
    ${acceptSection}
  `;
}

// ── Accept ─────────────────────────────────────────────────
function acceptQuote() {
  const q = getQuote();
  if (!q) return;
  const btn = document.getElementById('accept-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Processing...'; }

  q.status     = 'accepted';
  q.acceptedAt = Date.now();
  saveQuote(q);

  setTimeout(render, 400);
}

render();
</script>
</body>
</html>
