<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Quotation — Studio App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f4; color: #1a1a1a; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
      padding: 2rem; max-width: 520px; width: 100%; text-align: center;
    }
    .studio-name { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .quote-ref { font-size: 13px; font-weight: 600; color: #185fa5; background: #eff6ff; display: inline-block; padding: 3px 10px; border-radius: 20px; margin-bottom: .75rem; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: .4rem; }
    .client-name { font-size: 15px; color: #555; margin-bottom: 1.25rem; }
    .amount-block { background: #f9fafb; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; }
    .amount-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }
    .amount-value { font-size: 32px; font-weight: 800; color: #1a1a1a; }
    .items-list { text-align: left; margin-bottom: 1.5rem; border: 1px solid #e5e5e5; border-radius: 10px; overflow: hidden; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
    .item-row:last-child { border-bottom: none; }
    .item-desc { color: #1a1a1a; flex: 1; }
    .item-tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
    .tag-service { background: #f0fdf4; color: #166534; }
    .tag-expense { background: #fef9ee; color: #92400e; }
    .item-amt { font-weight: 600; color: #555; white-space: nowrap; }
    .totals { text-align: right; padding: 0 14px; margin-bottom: 1.5rem; }
    .tot-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #555; }
    .tot-row.grand { font-weight: 700; font-size: 15px; color: #1a1a1a; border-top: 1px solid #e5e5e5; margin-top: 5px; padding-top: 8px; }
    .accept-btn {
      width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
      background: #1a1a1a; color: #fff; border: none; border-radius: 10px;
      cursor: pointer; transition: opacity .15s; margin-bottom: .75rem;
    }
    .accept-btn:hover { opacity: .85; }
    .accept-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 1; }
    .legal { font-size: 12px; color: #aaa; line-height: 1.5; }
    .valid-until { font-size: 12px; color: #888; margin-bottom: 1.25rem; }
    /* States */
    .state-loading, .state-error, .state-done { display: none; }
    .state-loading.show, .state-error.show, .state-done.show { display: block; }
    .state-main { display: block; }
    .state-main.hidden { display: none; }
    .done-icon { font-size: 56px; margin-bottom: 1rem; }
    .done-title { font-size: 22px; font-weight: 700; margin-bottom: .5rem; }
    .done-sub { font-size: 14px; color: #666; }
    .done-time { font-size: 12px; color: #aaa; margin-top: .5rem; }
    .err-msg { color: #9b1c1c; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 10px; padding: 1rem; font-size: 14px; }
    .expired-tag { background: #fef2f2; color: #9b1c1c; border: 1px solid #fca5a5; display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="card">
  <!-- Loading -->
  <div class="state-loading" id="state-loading"><p style="color:#888">Loading quote...</p></div>

  <!-- Error -->
  <div class="state-error" id="state-error">
    <div class="done-icon">❌</div>
    <div class="err-msg" id="err-msg">This link is invalid or has expired.</div>
  </div>

  <!-- Already accepted -->
  <div class="state-done" id="state-done">
    <div class="done-icon">✅</div>
    <div class="done-title">Quote Accepted</div>
    <div class="done-sub" id="done-sub">This quotation has already been accepted.</div>
    <div class="done-time" id="done-time"></div>
  </div>

  <!-- Main acceptance view -->
  <div class="state-main hidden" id="state-main">
    <div class="studio-name" id="v-studio"></div>
    <div class="quote-ref" id="v-ref"></div>
    <h1>Quotation</h1>
    <div class="client-name" id="v-client"></div>
    <div class="valid-until" id="v-valid"></div>
    <div class="items-list" id="v-items"></div>
    <div class="totals" id="v-totals"></div>
    <button class="accept-btn" id="accept-btn" onclick="doAccept()">
      ✓ I Accept This Quotation
    </button>
    <div class="legal">
      By clicking "I Accept", you confirm your agreement to the quotation above.
      This will be recorded with a timestamp as your acceptance.
    </div>
  </div>
</div>

<script src="js/env.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/core.js"></script>
<script src="js/supabase.js"></script>
<script>
'use strict';

function fmt(n) { return fmtINR(n); }

function show(id) {
  ['state-loading','state-error','state-done','state-main'].forEach(function(s) {
    var el = document.getElementById(s);
    if (el) { el.classList.remove('show'); el.classList.add(s === 'state-main' ? 'hidden' : ''); }
  });
  var target = document.getElementById(id);
  if (!target) return;
  if (id === 'state-main') { target.classList.remove('hidden'); }
  else { target.classList.add('show'); }
}

var _token = '';

(async function init() {
  show('state-loading');
  var params = new URLSearchParams(window.location.search);
  _token = params.get('t') || '';
  if (!_token) { show('state-error'); document.getElementById('err-msg').textContent = 'Invalid acceptance link.'; return; }

  // Try Supabase first (production), fallback to localStorage (dev)
  var _sbToken = await sbGetAcceptToken(_token).catch(() => null);
  var q = null;
  if (_sbToken) {
    // Fetch the quote via Supabase
    const { data } = await _sb.from('quotes').select('data').eq('id', _sbToken.quote_id).single().catch(() => ({ data: null }));
    q = data?.data || null;
  }
  if (!q) q = getQuoteByToken(_token); // localStorage fallback
  if (!q) { show('state-error'); document.getElementById('err-msg').textContent = 'This link is invalid or has expired.'; return; }

  // Check token expiry (expires_at set when quote has a validUntil date)
  if (_sbToken && _sbToken.expires_at) {
    if (new Date(_sbToken.expires_at) < new Date()) {
      show('state-error');
      document.getElementById('err-msg').textContent =
        'This quotation link has expired. Please contact the studio for an updated quote.';
      return;
    }
  }
  // Also check quote's own validUntil as a fallback
  if (q.validUntil && q.status === 'sent') {
    const today = new Date().toISOString().split('T')[0];
    if (q.validUntil < today) {
      show('state-error');
      document.getElementById('err-msg').textContent =
        'This quotation has expired (valid until ' + q.validUntil + '). Please contact the studio.';
      return;
    }
  }

  if (q.status === 'accepted' || q.status === 'invoiced') {
    show('state-done');
    var s = getSettings();
    document.getElementById('done-sub').textContent = q.ref + ' — ' + (q.clientName||'') + ' has accepted this quotation.'
      + (q.status === 'invoiced' ? ' (Invoice has been raised.)' : '');
    if (q.acceptedAt) {
      document.getElementById('done-time').textContent = 'Accepted on ' + new Date(q.acceptedAt).toLocaleString('en-IN', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    return;
  }

  // Check expired
  var expired = q.validUntil && new Date(q.validUntil + 'T00:00:00') < new Date();

  var s = getSettings();
  document.getElementById('v-studio').textContent = s.studioName || 'Studio App';
  document.getElementById('v-ref').textContent = q.ref;
  document.getElementById('v-client').textContent = 'For: ' + (q.clientName || '—');
  if (q.validUntil) {
    var d = new Date(q.validUntil + 'T00:00:00');
    var ds = d.toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'});
    document.getElementById('v-valid').textContent = expired ? '⚠ Valid until ' + ds + ' (expired)' : 'Valid until ' + ds;
    if (expired) document.getElementById('v-valid').style.color = '#9b1c1c';
  }

  // Items
  var items = q.lineItems || [];
  document.getElementById('v-items').innerHTML = items.map(function(item) {
    var amt = Math.round((item.qty||1)*(item.rate||0));
    var tag = item.itemType === 'expense'
      ? '<span class="item-tag tag-expense">Expense</span>'
      : '<span class="item-tag tag-service">Service</span>';
    return '<div class="item-row"><span class="item-desc">' + esc(item.desc||'') + tag + '</span><span class="item-amt">' + fmt(amt) + '</span></div>';
  }).join('');

  // Totals
  var totalsHtml = '<div class="tot-row"><span>Subtotal</span><span>' + fmt(q.subtotal||0) + '</span></div>';
  if ((q.discount||0) > 0) totalsHtml += '<div class="tot-row" style="color:#1d6f42"><span>Discount</span><span>−' + fmt(q.discount) + '</span></div>';
  if ((q.gst||0) > 0) totalsHtml += '<div class="tot-row"><span>GST (' + (q.gstRate||0) + '%)</span><span>' + fmt(q.gst) + '</span></div>';
  totalsHtml += '<div class="tot-row grand"><span>Total</span><span>' + fmt(q.total||0) + '</span></div>';
  document.getElementById('v-totals').innerHTML = totalsHtml;

  if (expired) {
    document.getElementById('accept-btn').disabled = true;
    document.getElementById('accept-btn').textContent = 'Quotation Expired';
  }

  show('state-main');
})();

async function doAccept() {
  var btn = document.getElementById('accept-btn');
  btn.disabled = true;
  btn.textContent = 'Processing...';
  // Try Supabase-backed acceptance
  var ok = false;
  if (_sbToken) {
    // Update via Supabase
    const { error } = await _sb.from('quotes')
      .update({ data: { ...q, status:'accepted', acceptedAt: Date.now(), acceptToken: _token } })
      .eq('id', _sbToken.quote_id).catch(e => ({ error: e }));
    ok = !error;
  }
  if (!ok) ok = markQuoteAccepted(_token); // localStorage fallback
  if (ok) {
    show('state-done');
    var q = getQuoteByToken(_token) || {};
    document.getElementById('done-sub').textContent = (q.ref||'') + ' has been accepted. The photographer will be notified.';
    document.getElementById('done-time').textContent = 'Accepted on ' + new Date().toLocaleString('en-IN', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  } else {
    show('state-error');
    document.getElementById('err-msg').textContent = 'Something went wrong. Please contact the studio.';
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
