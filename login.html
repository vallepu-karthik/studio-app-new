<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Sign in — Studio App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f4; color: #1a1a1a;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
      padding: 2rem; width: 100%; max-width: 400px;
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-name { font-size: 22px; font-weight: 800; color: #1a1a1a; }
    .brand-sub  { font-size: 13px; color: #888; margin-top: 4px; }

    .tabs { display: flex; border-bottom: 1px solid #e5e5e5; margin-bottom: 1.5rem; }
    .tab  { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 500;
            cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
    .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 11px; font-weight: 600; color: #555;
            text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1px solid #d0d0d0; border-radius: 8px;
      background: #fff; color: #1a1a1a; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: #1a1a1a; box-shadow: 0 0 0 3px rgba(26,26,26,.08); }

    .btn {
      width: 100%; padding: 12px; background: #1a1a1a; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .15s; margin-top: .5rem;
    }
    .btn:hover { background: #333; }
    .btn:disabled { background: #aaa; cursor: default; }

    .error-msg {
      background: #fef2f2; border: 1px solid #fca5a5; color: #9b1c1c;
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      margin-bottom: 1rem; display: none;
    }
    .success-msg {
      background: #eaf3de; border: 1px solid #97c459; color: #1d6f42;
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      margin-bottom: 1rem; display: none;
    }
    .divider { text-align: center; font-size: 12px; color: #aaa; margin: 1rem 0; }
    .terms { font-size: 11px; color: #aaa; text-align: center; margin-top: 1rem; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-name">Studio App</div>
    <div class="brand-sub">Quotations & invoices for photographers</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</div>
    <div class="tab"        id="tab-signup" onclick="switchTab('signup')">Create account</div>
  </div>

  <div id="error-msg"   class="error-msg"></div>
  <div id="success-msg" class="success-msg"></div>

  <!-- Sign in form -->
  <div id="form-signin">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') signIn()">
    </div>
    <button class="btn" id="si-btn" onclick="signIn()">Sign in</button>
    <div class="divider">Forgot your password? <a href="#" onclick="resetPassword()" style="color:#185fa5">Reset it</a></div>
  </div>

  <!-- Sign up form -->
  <div id="form-signup" style="display:none">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="su-password" placeholder="Min 6 characters" autocomplete="new-password"
        onkeydown="if(event.key==='Enter') signUp()">
    </div>
    <div class="form-group">
      <label>Studio name</label>
      <input type="text" id="su-studio" placeholder="Airavata Photography"
        onkeydown="if(event.key==='Enter') signUp()">
    </div>
    <button class="btn" id="su-btn" onclick="signUp()">Create account</button>
    <div class="terms">By creating an account you agree to our terms of service.<br>100 quotes + 100 invoices free for 6 months.</div>
  </div>
</div>

<!-- Load Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script>
'use strict';

// Redirect if already logged in
sbGetSession().then(session => {
  if (session) window.location.href = 'index.html';
});

function switchTab(tab) {
  document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('form-signin').style.display = tab === 'signin' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  clearMessages();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}
function clearMessages() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('success-msg').style.display = 'none';
}

async function signIn() {
  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;
  if (!email || !password) { showError('Please enter your email and password.'); return; }
  const btn = document.getElementById('si-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await sbSignIn(email, password);
    window.location.href = 'index.html';
  } catch(e) {
    showError(e.message || 'Sign in failed. Check your email and password.');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function signUp() {
  const email    = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const studio   = document.getElementById('su-studio').value.trim();
  if (!email || !password) { showError('Please enter your email and password.'); return; }
  if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
  const btn = document.getElementById('su-btn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const data = await sbSignUp(email, password);
    // Save studio name to localStorage so it's available immediately after redirect
    if (studio) {
      const existing = JSON.parse(localStorage.getItem('sa_settings_v1') || 'null') || {};
      existing.studioName = studio;
      localStorage.setItem('sa_settings_v1', JSON.stringify(existing));
    }
    if (data.session) {
      window.location.href = 'index.html';
    } else {
      showSuccess('Account created! Check your email to confirm, then sign in.');
      btn.disabled = false; btn.textContent = 'Create account';
    }
  } catch(e) {
    showError(e.message || 'Could not create account. Try a different email.');
    btn.disabled = false; btn.textContent = 'Create account';
  }
}

async function resetPassword() {
  const email = document.getElementById('si-email').value.trim();
  if (!email) { showError('Enter your email address first.'); return; }
  try {
    await window._sb?.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/index.html'
    });
    showSuccess('Password reset email sent. Check your inbox.');
  } catch(e) {
    showError(e.message || 'Could not send reset email.');
  }
}
</script>
</body>
</html>
