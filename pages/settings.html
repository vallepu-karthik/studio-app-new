<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Studio App</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .settings-section { margin-bottom: 1.5rem; }
    .settings-section h3 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .85rem; padding-bottom: .5rem; border-bottom: 1px solid #e5e5e5; }
    @media(max-width:640px){ .settings-grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <div class="page">
      <div class="limit-banner" id="limit-banner"></div>
      <div class="page-header">
        <h1>Settings</h1>
        <button class="btn btn-primary" onclick="saveAll()">Save changes</button>
      </div>

      <!-- Studio identity -->
      <div class="card" style="margin-bottom:1rem">
        <div class="settings-section">
          <h3>Studio identity</h3>
          <div class="settings-grid">
            <div class="form-group">
              <label>Studio name</label>
              <input type="text" id="studioName" placeholder="Lens & Light Studio">
            </div>
            <div class="form-group">
              <label>Tagline <span style="font-weight:400;color:#aaa">(optional)</span></label>
              <input type="text" id="tagline" placeholder="Capturing moments forever">
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3>Contact info</h3>
          <div class="settings-grid">
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="phone" placeholder="+91 98001 12345">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="email" placeholder="hello@yourstudio.in">
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" id="address" placeholder="Banjara Hills, Hyderabad">
            </div>
            <div class="form-group">
              <label>GST number <span style="font-weight:400;color:#aaa">(GSTIN)</span></label>
              <input type="text" id="gstin" placeholder="27AAPFU0939F1ZV" maxlength="15">
              <span class="form-hint">Appears on all invoice PDFs</span>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3>Numbering format</h3>
          <div class="settings-grid">
            <div class="form-group">
              <label>Quote prefix</label>
              <input type="text" id="quotePrefix" placeholder="QT-" maxlength="10">
            </div>
            <div class="form-group">
              <label>Invoice prefix</label>
              <input type="text" id="invoicePrefix" placeholder="INV-" maxlength="10">
            </div>
            <div class="form-group">
              <label>Starting number</label>
              <input type="number" id="startNumber" placeholder="1" min="1">
            </div>
          </div>
        </div>

        <div class="settings-section" style="margin-bottom:0">
          <h3>Invoice defaults</h3>
          <div class="settings-grid">
            <div class="form-group">
              <label>Payment due (days)</label>
              <input type="number" id="paymentDays" placeholder="14" min="1">
            </div>
            <div class="form-group">
              <label>Currency</label>
              <select id="currency">
                <option value="INR">INR (₹)</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label>Default notes</label>
              <textarea id="defaultNotes" placeholder="Thank you for choosing us!"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Trial info -->
      <div class="card">
        <div class="settings-section" style="margin-bottom:0">
          <h3>Free trial usage</h3>
          <div class="settings-grid">
            <div class="form-group">
              <label>Days remaining</label>
              <input type="text" id="trial-days" readonly style="background:#fafaf9;color:#555">
            </div>
            <div class="form-group">
              <label>Quotations used</label>
              <input type="text" id="trial-quotes" readonly style="background:#fafaf9;color:#555">
            </div>
            <div class="form-group">
              <label>Invoices used</label>
              <input type="text" id="trial-invoices" readonly style="background:#fafaf9;color:#555">
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
<div id="toast"></div>
<script src="../js/core.js"></script>
<script src="../js/nav.js"></script>
<script>
  renderNav('settings', '../');
  initLimitBanner();
  loadSettings();

  function loadSettings() {
    const s = getSettings();
    document.getElementById('studioName').value    = s.studioName   || '';
    document.getElementById('tagline').value       = s.tagline      || '';
    document.getElementById('phone').value         = s.phone        || '';
    document.getElementById('email').value         = s.email        || '';
    document.getElementById('address').value       = s.address      || '';
    document.getElementById('gstin').value         = s.gstin        || '';
    document.getElementById('quotePrefix').value   = s.quotePrefix  || 'QT-';
    document.getElementById('invoicePrefix').value = s.invoicePrefix|| 'INV-';
    document.getElementById('startNumber').value   = s.startNumber  || 1;
    document.getElementById('paymentDays').value   = s.paymentDays  || 14;
    document.getElementById('defaultNotes').value  = s.defaultNotes || '';
    document.getElementById('currency').value      = s.currency     || 'INR';

    // Trial
    const d = getTrialData();
    document.getElementById('trial-days').value    = trialDaysLeft() + ' of 180 days';
    document.getElementById('trial-quotes').value  = d.quotes + ' of 100';
    document.getElementById('trial-invoices').value= d.invoices + ' of 100';
  }

  function saveAll() {
    const s = {
      studioName:    document.getElementById('studioName').value.trim()    || 'Studio App',
      tagline:       document.getElementById('tagline').value.trim(),
      phone:         document.getElementById('phone').value.trim(),
      email:         document.getElementById('email').value.trim(),
      address:       document.getElementById('address').value.trim(),
      gstin:         document.getElementById('gstin').value.trim().toUpperCase(),
      quotePrefix:   document.getElementById('quotePrefix').value.trim()   || 'QT-',
      invoicePrefix: document.getElementById('invoicePrefix').value.trim() || 'INV-',
      startNumber:   parseInt(document.getElementById('startNumber').value) || 1,
      paymentDays:   parseInt(document.getElementById('paymentDays').value) || 14,
      defaultNotes:  document.getElementById('defaultNotes').value.trim(),
      currency:      document.getElementById('currency').value,
    };
    saveSettings(s);
    renderNav('settings', '../'); // refresh brand name in sidebar
    showToast('Settings saved');
  }
</script>
</body>
</html>
