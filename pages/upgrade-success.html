<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Pro — Studio App</title>
  <script>
    (function() {
      try {
        var s = JSON.parse(localStorage.getItem('sa_settings_v1') || '{}');
        if (s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f4; --bg2: #ffffff; --border: #e5e5e5;
      --text: #1a1a1a; --text2: #555; --text3: #888;
      --green: #639922; --green-bg: #eaf3de;
    }
    html[data-theme="dark"] {
      --bg: #111111; --bg2: #1c1c1c; --border: #2a2a2a;
      --text: #f0f0f0; --text2: #aaaaaa; --text3: #777777;
      --green-bg: #1a2e14;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 3rem 2.5rem; text-align: center;
      max-width: 420px; width: 90%;
      animation: fadeUp .4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--green-bg); color: var(--green);
      font-size: 28px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: .5rem; }
    p  { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 2rem; }
    .features {
      list-style: none; text-align: left;
      background: var(--bg); border-radius: 10px; padding: 1rem 1.25rem;
      margin-bottom: 2rem;
    }
    .features li {
      font-size: 13px; color: var(--text2); padding: 5px 0;
      display: flex; align-items: center; gap: 8px;
    }
    .features .check { color: var(--green); }
    .btn {
      display: inline-block; background: var(--green); color: #fff;
      padding: 12px 32px; border-radius: 8px; font-size: 14px; font-weight: 600;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .sub { font-size: 12px; color: var(--text3); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>You're now on Pro!</h1>
    <p>Payment confirmed. Your account has been upgraded — all limits are now removed.</p>
    <ul class="features">
      <li><span class="check">✓</span> Unlimited quotes</li>
      <li><span class="check">✓</span> Unlimited invoices</li>
      <li><span class="check">✓</span> No time limit</li>
      <li><span class="check">✓</span> Email notifications on acceptance</li>
    </ul>
    <a class="btn" href="/app">Go to dashboard →</a>
    <p class="sub">A receipt has been sent to your email by Stripe.</p>
  </div>

  <script src="js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // Update local plan status so the UI reflects Pro immediately
    // (webhook may take a few seconds — this is optimistic)
    (async function() {
      try {
        const SUPABASE_URL      = window.__ENV?.SUPABASE_URL || '';
        const SUPABASE_ANON_KEY = window.__ENV?.SUPABASE_ANON_KEY || '';
        if (!SUPABASE_URL) return;

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return;

        // Poll until webhook has updated the plan (max 10s)
        let attempts = 0;
        const poll = setInterval(async () => {
          attempts++;
          const { data: profile } = await sb.from('profiles')
            .select('plan').eq('id', session.user.id).single();
          if (profile?.plan === 'pro' || attempts >= 10) {
            clearInterval(poll);
            // Update localStorage plan cache
            const settings = JSON.parse(localStorage.getItem('sa_settings_v1') || '{}');
            settings.plan = 'pro';
            localStorage.setItem('sa_settings_v1', JSON.stringify(settings));
          }
        }, 1000);
      } catch(e) { /* silent */ }
    })();
  </script>
</body>
</html>
