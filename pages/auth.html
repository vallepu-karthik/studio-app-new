<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign in — Studio App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f4; color: #1a1a1a;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.25rem;
    }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 18px;
      padding: 2.25rem 2rem; width: 100%; max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-icon { font-size: 36px; margin-bottom: .5rem; }
    .brand h1 { font-size: 22px; font-weight: 800; }
    .brand p  { font-size: 13px; color: #888; margin-top: .25rem; }

    .tabs { display: flex; background: #f5f5f4; border-radius: 10px; padding: 3px; margin-bottom: 1.75rem; }
    .tab {
      flex: 1; padding: 8px; font-size: 13px; font-weight: 600;
      background: none; border: none; border-radius: 8px; cursor: pointer;
      color: #888; transition: all .15s;
    }
    .tab.active { background: #fff; color: #1a1a1a; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    label { display: block; font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1px solid #d0d0d0; border-radius: 8px; font-family: inherit;
      margin-bottom: 1rem; transition: border-color .15s;
    }
    input:focus { outline: none; border-color: #1a1a1a; }

    .btn-primary {
      width: 100%; padding: 13px; font-size: 14px; font-weight: 700;
      background: #1a1a1a; color: #fff; border: none; border-radius: 10px;
      cursor: pointer; transition: opacity .15s; margin-top: .25rem;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px;
      padding: .75rem 1rem; font-size: 13px; color: #9b1c1c;
      margin-bottom: 1rem; display: none;
    }
    .success-msg {
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px;
      padding: .75rem 1rem; font-size: 13px; color: #166534;
      margin-bottom: 1rem; display: none;
    }
    .divider { text-align: center; font-size: 12px; color: #aaa; margin: 1.25rem 0; }
    .footer-note { text-align: center; font-size: 12px; color: #aaa; margin-top: 1.25rem; }

    /* Password toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { margin-bottom: 0; padding-right: 40px; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #aaa; font-size: 15px;
      padding: 0 4px;
    }
    .pw-wrap { margin-bottom: 1rem; }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">📸</div>
    <h1>Studio App</h1>
    <p>Quotes &amp; invoices for photographers</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</button>
    <button class="tab"        id="tab-signup" onclick="switchTab('signup')">Create account</button>
  </div>

  <div id="error-msg"   class="error-msg"></div>
  <div id="success-msg" class="success-msg"></div>

  <!-- Sign in form -->
  <div id="form-signin">
    <label for="si-email">Email</label>
    <input type="email" id="si-email" placeholder="you@studio.com" autocomplete="email">

    <label for="si-password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password">
      <button class="pw-toggle" onclick="togglePw('si-password', this)" tabindex="-1">👁</button>
    </div>

    <button class="btn-primary" id="btn-signin" onclick="doSignIn()">Sign in</button>

    <div class="divider">or</div>
    <button class="btn-primary" style="background:#f5f5f4;color:#1a1a1a;border:1px solid #e0e0e0" onclick="switchTab('forgot')">
      Forgot password?
    </button>
  </div>

  <!-- Sign up form -->
  <div id="form-signup" style="display:none">
    <label for="su-name">Studio name</label>
    <input type="text" id="su-name" placeholder="Lens &amp; Light Studio">

    <label for="su-email">Email</label>
    <input type="email" id="su-email" placeholder="you@studio.com" autocomplete="email">

    <label for="su-password">Password <span style="font-weight:400;color:#aaa">(min 8 chars)</span></label>
    <div class="pw-wrap">
      <input type="password" id="su-password" placeholder="••••••••" autocomplete="new-password">
      <button class="pw-toggle" onclick="togglePw('su-password', this)" tabindex="-1">👁</button>
    </div>

    <button class="btn-primary" id="btn-signup" onclick="doSignUp()">Create account</button>
  </div>

  <!-- Forgot password -->
  <div id="form-forgot" style="display:none">
    <p style="font-size:13px;color:#555;margin-bottom:1rem">Enter your email and we'll send a reset link.</p>
    <label for="fp-email">Email</label>
    <input type="email" id="fp-email" placeholder="you@studio.com">
    <button class="btn-primary" id="btn-forgot" onclick="doForgot()">Send reset link</button>
    <div class="divider"></div>
    <button style="width:100%;background:none;border:none;color:#888;font-size:13px;cursor:pointer" onclick="switchTab('signin')">← Back to sign in</button>
  </div>

  <div class="footer-note" id="footer-note">Your data is end-to-end encrypted and backed up to the cloud.</div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/core.js"></script>
<script src="../js/supabase.js"></script>
<script>
'use strict';

// If already logged in, skip to dashboard
(async function() {
  const session = await sbGetSession();
  if (session) window.location.href = '../dashboard.html';
})();

function switchTab(tab) {
  document.getElementById('form-signin').style.display = tab === 'signin' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('form-forgot').style.display = tab === 'forgot' ? 'block' : 'none';
  document.getElementById('tab-signin').className = 'tab' + (tab === 'signin' ? ' active' : '');
  document.getElementById('tab-signup').className = 'tab' + (tab === 'signup' ? ' active' : '');
  document.getElementById('footer-note').style.display = tab === 'forgot' ? 'none' : 'block';
  clearMessages();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}
function clearMessages() {
  document.getElementById('error-msg').style.display   = 'none';
  document.getElementById('success-msg').style.display = 'none';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="spinner"></span>Please wait...'
    : btn.dataset.label || btn.textContent;
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
}

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁'; }
}

async function doSignIn() {
  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;
  if (!email || !password) { showError('Enter your email and password.'); return; }
  setLoading('btn-signin', true);
  try {
    await sbSignIn(email, password);
    window.location.href = '../dashboard.html';
  } catch (e) {
    showError(friendlyError(e.message));
    setLoading('btn-signin', false);
  }
}

async function doSignUp() {
  const name     = document.getElementById('su-name').value.trim();
  const email    = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  if (!email || !password) { showError('Email and password are required.'); return; }
  if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
  setLoading('btn-signup', true);
  try {
    await sbSignUp(email, password);
    // Pre-set studio name in localStorage so onboarding picks it up
    if (name) {
      const s = Store.get('sa_settings_v1') || {};
      s.studioName = name;
      Store.set('sa_settings_v1', s);
    }
    showSuccess('Account created! Check your email to confirm, then sign in.');
    setLoading('btn-signup', false);
  } catch (e) {
    showError(friendlyError(e.message));
    setLoading('btn-signup', false);
  }
}

async function doForgot() {
  const email = document.getElementById('fp-email').value.trim();
  if (!email) { showError('Enter your email address.'); return; }
  setLoading('btn-forgot', true);
  try {
    const { error } = await _sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/pages/auth.html'
    });
    if (error) throw error;
    showSuccess('Reset link sent — check your inbox.');
  } catch (e) {
    showError(friendlyError(e.message));
  }
  setLoading('btn-forgot', false);
}

function friendlyError(msg) {
  if (!msg) return 'Something went wrong. Please try again.';
  if (msg.includes('Invalid login'))     return 'Incorrect email or password.';
  if (msg.includes('Email not confirmed')) return 'Please confirm your email first.';
  if (msg.includes('already registered')) return 'An account with this email already exists.';
  if (msg.includes('rate limit'))        return 'Too many attempts. Please wait a moment.';
  return msg;
}

// Allow Enter key to submit
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('[id^="form-"]:not([style*="none"])');
  if (!active) return;
  if (active.id === 'form-signin') doSignIn();
  if (active.id === 'form-signup') doSignUp();
  if (active.id === 'form-forgot') doForgot();
});
</script>
</body>
</html>
